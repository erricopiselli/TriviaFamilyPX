<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TriviaFamilyPX</title>
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trivia">
<meta name="theme-color" content="#7c4dff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffe8c7;--bg2:#e9ddff;--card:#fffdf8;--card2:#f6f0ff;--tx:#2b2540;--mut:#6d6786;
  --pri:#7c4dff;--pri2:#5a36c9;--ok:#2ea66a;--ko:#e5484d;--bd:#ebe2d3;--track:#efe6d8;
  --gold:#ffc83d;
  --ff-d:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --ff-b:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#1d1838;--bg2:#2a1f4f;--card:#2a2548;--card2:#332c58;--tx:#f3efff;
    --mut:#b1aacd;--pri:#7c4dff;--pri2:#4b2bb0;--ok:#3fc384;--ko:#ff6b70;--bd:#41397a;--track:#3a3266;
  }
}
:root[data-theme="dark"]{
  --bg1:#1d1838;--bg2:#2a1f4f;--card:#2a2548;--card2:#332c58;--tx:#f3efff;
  --mut:#b1aacd;--pri:#7c4dff;--pri2:#4b2bb0;--ok:#3fc384;--ko:#ff6b70;--bd:#41397a;--track:#3a3266;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--bg2)}
body{
  min-height:100vh;
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
  color:var(--tx);font-family:var(--ff-b);font-size:17px;line-height:1.45;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
#app{max-width:560px;margin:0 auto;padding:14px 16px 28px}
h1,h2,.disp{font-family:var(--ff-d);font-weight:700;letter-spacing:-.3px}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 2px}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{font-size:1.9rem;line-height:1}
.brand.sm svg{width:30px;height:30px}
.brand.sm h1{font-size:1.35rem}
.sub{text-align:center;color:var(--mut);font-weight:700;margin:6px 0 4px}
.card{
  background:var(--card);border-radius:24px;padding:18px;margin:14px 0;
  box-shadow:0 2px 0 var(--bd),0 10px 30px rgba(60,30,120,.08);
}
h2{font-size:1.35rem;margin-bottom:10px}
.lbl{font-weight:800;font-size:.85rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px}
input{
  font:inherit;font-weight:700;padding:12px 14px;border-radius:14px;border:2px solid var(--bd);
  background:var(--card2);color:var(--tx);width:100%;outline:none;
}
input:focus{border-color:var(--pri)}
button{
  font:inherit;font-family:var(--ff-d);font-weight:600;cursor:pointer;border:0;border-radius:16px;
  padding:13px 18px;background:var(--pri);color:#fff;font-size:1.05rem;
  box-shadow:0 4px 0 var(--pri2);transition:transform .08s,box-shadow .08s,background .2s;
  -webkit-tap-highlight-color:transparent;
}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri2)}
button:disabled{cursor:default}
button.sec{background:transparent;color:var(--tx);border:2px solid var(--bd);box-shadow:none}
button.wide{width:100%}
button.cta{font-size:1.2rem;padding:15px}
.ages{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.age{
  background:var(--card2);color:var(--tx);box-shadow:none;border:2px solid transparent;
  display:flex;align-items:center;gap:8px;padding:10px 12px;text-align:left;font-size:.98rem;
}
.age .em{font-size:1.5rem}
.age small{display:block;font-family:var(--ff-b);font-weight:700;color:var(--mut);font-size:.78rem}
.age.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,var(--card))}
.players{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pchip{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:16px;padding:8px 8px 8px 10px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;flex:none;background:var(--card);box-shadow:inset 0 0 0 3px var(--ring,var(--bd))}
.pchip .nm{font-weight:800;flex:1;min-width:0}
.pchip .nm small{display:block;color:var(--mut);font-weight:700;font-size:.8rem}
.x{padding:6px 11px;font-size:.9rem;box-shadow:none;background:transparent;color:var(--mut);border:2px solid var(--bd)}
.hint{color:var(--mut);font-size:.9rem;text-align:center;margin-top:10px}
.ver{text-align:center;color:var(--mut);font-size:.75rem;font-weight:700;opacity:.8;margin:2px 0 0}
.cols>*{min-width:0}
.cols.q{display:flex;flex-direction:column}
.cols.q .qside{display:contents}
.cols.q .qside .tools{order:3}
body.land .cols.q{display:grid}
body.land .cols.q .qside{display:block}
body.land #app{max-width:1100px;padding:10px 20px 18px}
body.land .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
body.land .cols.q{grid-template-columns:minmax(200px,30%) 1fr}
body.land .cols .card{margin:10px 0}
body.land .brand{margin:2px 0}
body.land .board{max-width:min(300px,68vh)}
body.land .board.small{max-width:min(220px,52vh)}
body.land .opt{margin-top:8px;padding:10px 14px}
body.land .kid .opt{padding:12px 14px}
body.land .qtext{font-size:1.2rem}
body.land .kid .qtext{font-size:1.45rem}
body.land .qside .tools{justify-content:center;margin-top:10px}
/* Board */
.board{position:relative;width:100%;max-width:360px;margin:4px auto 0}
.board svg{display:block;width:100%;height:auto}
.board.small{max-width:230px}
/* Turn */
.turn{text-align:center}
.turn .who{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--ff-d);font-size:1.35rem;font-weight:600}
.die{
  width:84px;height:84px;margin:14px auto 12px;border-radius:20px;background:#fff;position:relative;
  box-shadow:inset 0 -6px 0 #e7e0f5,0 6px 16px rgba(60,30,120,.18);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12px;
}
.die i{width:14px;height:14px;border-radius:50%;background:#2b2540;place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.die.roll{animation:roll .45s ease-in-out infinite}
@keyframes roll{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(-18deg) translateY(-8px)}50%{transform:rotate(12deg) translateY(0)}75%{transform:rotate(-8deg) translateY(-4px)}100%{transform:rotate(0)}}
.scores{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px}
.sc{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:99px;padding:4px 10px 4px 4px;font-weight:800;font-size:.9rem;box-shadow:0 2px 0 var(--bd)}
.sc.now{outline:2px solid var(--pri)}
.sc svg{width:26px;height:26px}
/* Question */
.qcard{padding:0;overflow:hidden}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;color:#fff;font-family:var(--ff-d);font-weight:600}
.qhead .badge{background:#fff;color:var(--tx);border-radius:99px;padding:2px 10px;font-size:.8rem;font-family:var(--ff-b);font-weight:800;white-space:nowrap}
.qbody{padding:16px}
.qtext{font-family:var(--ff-d);font-weight:600;font-size:1.32rem;line-height:1.3}
.kid .qtext{font-size:1.6rem}
.meta{display:flex;align-items:center;gap:6px;color:var(--mut);font-weight:800;font-size:.85rem;margin-bottom:8px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:10px 0 0;
  background:var(--card2);color:var(--tx);box-shadow:0 3px 0 var(--bd);font-family:var(--ff-b);font-weight:800;font-size:1.05rem;padding:12px 14px;
}
.kid .opt{font-size:1.25rem;padding:15px 14px}
.opt .k{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--mut);font-family:var(--ff-d);flex:none;font-size:.95rem}
.opt.ok{background:var(--ok);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--ok) 70%,#000)}
.opt.ko{background:var(--ko);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--ko) 70%,#000);animation:shake .4s}
.opt.ok .k,.opt.ko .k{background:rgba(255,255,255,.25);color:#fff}
.opt.dim{opacity:.5}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.res{font-family:var(--ff-d);font-weight:700;font-size:1.3rem;margin-top:16px}
.fact{background:var(--card2);border-radius:14px;padding:12px;margin-top:10px;font-size:.98rem;font-weight:700}
.tools{display:flex;gap:8px;margin-top:2px}
.pop{animation:pp .35s}
.tmr{display:flex;align-items:center;gap:10px;margin:12px 0 2px}
.tmr .bar{flex:1;height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.tmr .bar i{display:block;height:100%;width:100%;background:var(--ok);border-radius:99px;transition:width .2s linear,background .3s}
.tmr b{font-family:var(--ff-d);font-size:1.1rem;min-width:44px;text-align:right}
.tmr.low .bar i{background:var(--ko)}.tmr.low b{color:var(--ko)}
.trow{display:flex;align-items:center;gap:10px;padding:6px 0}
.trow .tl{flex:1;font-weight:800}
.trow .tl small{display:block;color:var(--mut);font-weight:700;font-size:.8rem}
.step{width:38px;height:38px;padding:0;border-radius:12px;font-size:1.2rem;background:var(--card2);color:var(--tx);box-shadow:none}
.trow .v{font-family:var(--ff-d);font-weight:700;font-size:1.1rem;min-width:52px;text-align:center}
.switch{display:flex;gap:6px;background:var(--card2);border-radius:14px;padding:4px;margin-bottom:6px}
.switch button{flex:1;background:transparent;color:var(--tx);box-shadow:none;padding:9px;font-size:.98rem}
.switch button.on{background:var(--pri);color:#fff}
.tbody.off{opacity:.4;pointer-events:none}
@keyframes pp{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
/* End */
.rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px dashed var(--bd)}
.rank:last-child{border:0}
.rank .md{font-size:1.6rem;width:34px;text-align:center}
.rank .nm{flex:1;font-weight:800;font-size:1.1rem}
.rank svg{width:34px;height:34px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── CATEGORIES ──────────────────────────────────────────────────────────
var C=[
  {k:"an",n:"Animali & Natura",e:"🐾",c:"#2ea66a"},
  {k:"sc",n:"Scienza & Logica",  e:"🔬",c:"#3b82f6"},
  {k:"ge",n:"Geografia",        e:"🌍",c:"#f59e0b"},
  {k:"st",n:"Storia & Arte",    e:"🏛️",c:"#a855f7"},
  {k:"ca",n:"Cinema & Cartoni", e:"🎬",c:"#ec4899"},
  {k:"vg",n:"Videogiochi & Sport",e:"🎮",c:"#ef4444"}
];
var G={p:"Piccoli 3–5 🧸",b:"Bambini 6–11 🧒",r:"Ragazzi 12–17 🧑",a:"Adulti 🧔"};
var GA=[{k:"p",e:"🧸",n:"Piccoli",a:"3–5 anni"},{k:"b",e:"🧒",n:"Bambini",a:"6–11 anni"},{k:"r",e:"🧑",n:"Ragazzi",a:"12–17 anni"},{k:"a",e:"🧔",n:"Adulti",a:"18+"}];
// Per i 3–5 anni le categorie hanno nomi pensati per i più piccoli
var CP={an:{n:"Animali",e:"🐾"},sc:{n:"Colori & Forme",e:"🎨"},ge:{n:"Numeri & Lettere",e:"🔢"},st:{n:"Canzoncine & Fiabe",e:"🎵"},ca:{n:"Cartoni",e:"🏰"},vg:{n:"Parole in inglese",e:"🇬🇧"}};
function catLabel(cat,g){var o=(g==="p"&&CP[cat.k])||cat;return o.e+" "+o.n;}
var AV=["🦊","🐼","🐸","🦄","🐙","🦁"];
var AVC=["#ef4444","#3b82f6","#2ea66a","#a855f7","#ec4899","#f59e0b"];
var PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};

// ── DATABASE ─────────────────────────────────────────────────────────────
// Le domande sono nel file trivia_database.json (stessa cartella)
var DB=null;

// ── STATE ────────────────────────────────────────────────────────────────
var S={ps:[],t:0,cur:null};
var USED={};
var lastAge="b";
var TM={on:false,s:{p:40,b:30,r:20,a:15}};
var timerIv=null;
try{var _t=JSON.parse(localStorage.getItem("tq_timer")||"null");if(_t&&_t.s)TM=_t;}catch(e){}
function saveTM(){try{localStorage.setItem("tq_timer",JSON.stringify(TM))}catch(e){}}
function stopTimer(){if(timerIv){clearInterval(timerIv);timerIv=null;}}
try{USED=JSON.parse(localStorage.getItem("tq4_used")||"{}")}catch(e){}
try{lastAge=localStorage.getItem("tq_age")||"b"}catch(e){}
function saveUsed(){try{localStorage.setItem("tq4_used",JSON.stringify(USED))}catch(e){}}

// ── HELPERS ──────────────────────────────────────────────────────────────
function esc(s){
  return String(s).replace(/[&<>"]/g,function(c){
    return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}
// Le 6 caselle spicchio (ogni 4) hanno ciascuna una categoria diversa
function catAt(pos){return pos%4===0?C[pos/4]:C[pos%6]}
function f1(n){return n.toFixed(1)}
// Arc segment of a ring between angles (degrees, 0 = top)
function arc(cx,cy,r1,r2,a0,a1){
  function pt(a,r){a=(a-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
  var p0=pt(a0,r2),p1=pt(a1,r2),p2=pt(a1,r1),p3=pt(a0,r1),lg=(a1-a0)>180?1:0;
  return 'M'+f1(p0[0])+' '+f1(p0[1])+'A'+r2+' '+r2+' 0 '+lg+' 1 '+f1(p1[0])+' '+f1(p1[1])+
    'L'+f1(p2[0])+' '+f1(p2[1])+'A'+r1+' '+r1+' 0 '+lg+' 0 '+f1(p3[0])+' '+f1(p3[1])+'Z';
}
// Small 6-segment ring showing conquered wedges
function ringSVG(w,center){
  var s='<svg viewBox="0 0 40 40" aria-hidden="true">';
  C.forEach(function(c,i){
    var has=w.indexOf(c.k)>=0;
    s+='<path d="'+arc(20,20,11,19,i*60+4,(i+1)*60-4)+'" fill="'+(has?c.c:'var(--track)')+'"/>';
  });
  if(center)s+='<text x="20" y="25.5" text-anchor="middle" font-size="14">'+center+'</text>';
  return s+'</svg>';
}
function logoSVG(){
  var s='<svg viewBox="0 0 40 40" aria-hidden="true">';
  C.forEach(function(c,i){s+='<path d="'+arc(20,20,11,19,i*60+34,(i+1)*60+26)+'" fill="'+c.c+'"/>';});
  s+='<circle cx="20" cy="20" r="9.5" fill="#7c4dff"/>'+
     '<text x="20" y="25" text-anchor="middle" font-size="14" font-family="Fredoka,sans-serif" font-weight="700" fill="#fff">?</text>';
  return s+'</svg>';
}
function brand(sm){return '<div class="brand'+(sm?' sm':'')+'">'+logoSVG()+'<h1>TriviaFamilyPX</h1></div>';}
function dieHTML(n,id){
  var on=PIPS[n]||[];var s='<div class="die"'+(id?' id="'+id+'"':'')+' aria-label="Dado: '+n+'">';
  for(var i=0;i<9;i++)s+='<i'+(on.indexOf(i)>=0?' class="on"':'')+'></i>';
  return s+'</div>';
}
function setDie(el,n){var on=PIPS[n];el.querySelectorAll('i').forEach(function(p,i){p.className=on.indexOf(i)>=0?'on':'';});el.setAttribute('aria-label','Dado: '+n);}
function avHTML(p,j){return '<span class="av" style="--ring:'+AVC[j%6]+'">'+p.av+'</span>';}
function confetti(){
  var box=document.createElement('div');box.className='confetti';
  for(var i=0;i<40;i++){
    var c=document.createElement('i');
    c.style.left=(Math.random()*100)+'vw';
    c.style.background=C[i%6].c;
    c.style.animationDelay=(Math.random()*.3)+'s';
    c.style.animationDuration=(1+Math.random()*.8)+'s';
    box.appendChild(c);
  }
  document.body.appendChild(box);
  setTimeout(function(){box.remove();},2200);
}

// ── QUESTION PICKER ───────────────────────────────────────────────────────
function pick(fascia,catKey){
  var pool=DB[fascia][catKey];
  var key=fascia+":"+catKey;
  var used=USED[key]||[];
  var avail=[];
  for(var i=0;i<pool.length;i++){if(used.indexOf(i)<0)avail.push(i);}
  if(!avail.length){used=[];for(var i=0;i<pool.length;i++)avail.push(i);}
  var idx=avail[Math.floor(Math.random()*avail.length)];
  used.push(idx);
  USED[key]=used;
  saveUsed();
  var q=pool[idx];
  // q = [domanda, corretta, sbagliata1, sbagliata2, curiosità]
  var opts=shuffle([{t:q[1],ok:true},{t:q[2]},{t:q[3]}]);
  return {q:q[0],opts:opts,fact:q[4],cat:catKey};
}

// ── BOARD SVG ─────────────────────────────────────────────────────────────
function boardSVG(small){
  var cx=180,cy=180,R1=118,R2=162;
  var s='<svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tabellone">';
  for(var i=0;i<24;i++){
    var cat=catAt(i),big=(i%4===0);
    var a0=i*15+1.3,a1=(i+1)*15-1.3;
    s+='<path d="'+arc(cx,cy,big?R1-8:R1,big?R2+6:R2,a0-7.5,a1-7.5)+'" fill="'+cat.c+'"'+(big?'':' opacity=".82"')+'/>';
    if(big){
      var a=(i*15-90)*Math.PI/180,rm=(R1+R2)/2;
      var x=cx+rm*Math.cos(a),y=cy+rm*Math.sin(a);
      s+='<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="15" fill="#fff"/>'+
         '<text x="'+f1(x)+'" y="'+f1(y+5.5)+'" text-anchor="middle" font-size="16">'+cat.e+'</text>';
    }
  }
  // Player tokens (on the track)
  S.ps.forEach(function(p,j){
    var a=(p.pos*15-90)*Math.PI/180;
    var r=R1-22-(j%3)*15;
    var x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);
    var active=(j===S.t);
    s+='<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+(active?15:12)+'" fill="#fff" stroke="'+AVC[j%6]+'" stroke-width="'+(active?4:3)+'"/>'+
       '<text x="'+f1(x)+'" y="'+f1(y+(active?6:5))+'" text-anchor="middle" font-size="'+(active?17:13)+'">'+p.av+'</text>';
  });
  // Center: current player + wedge progress
  var cp=S.ps[S.t];
  if(cp){
    C.forEach(function(c,i){
      var has=cp.w.indexOf(c.k)>=0;
      s+='<path d="'+arc(cx,cy,40,62,i*60+3,(i+1)*60-3)+'" fill="'+(has?c.c:'var(--track)')+'"/>';
    });
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="36" fill="var(--card)"/>'+
       '<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-size="40">'+cp.av+'</text>';
  }
  return '<div class="board'+(small?' small':'')+'">'+s+'</svg></div>';
}

// ── SCOREBOARD ────────────────────────────────────────────────────────────
function scoreBar(){
  return '<div class="scores">'+S.ps.map(function(p,j){
    return '<span class="sc'+(j===S.t?' now':'')+'">'+ringSVG(p.w,p.av)+esc(p.n)+' · '+p.s+'</span>';
  }).join('')+'</div>';
}

// ── RENDER ────────────────────────────────────────────────────────────────
var app=document.getElementById('app');
function render(html){app.innerHTML=html;window.scrollTo(0,0);}

// ── SETUP SCREEN ──────────────────────────────────────────────────────────
function setup(){
  render(
    brand()+
    '<p class="sub">Tira il dado, gira il tabellone, conquista i 6 spicchi!</p>'+
    '<p class="ver">Database: '+DBN+' domande</p>'+
    '<div class="cols"><div>'+
    '<div class="card">'+
      '<h2>Chi gioca?</h2>'+
      '<input id="nm" placeholder="Nome del giocatore" maxlength="14" autocomplete="off">'+
      '<div class="lbl">Età</div>'+
      '<div class="ages" id="ages">'+GA.map(function(g){
        return '<button class="age'+(g.k===lastAge?' on':'')+'" data-k="'+g.k+'"><span class="em">'+g.e+'</span><span>'+g.n+'<small>'+g.a+'</small></span></button>';
      }).join('')+'</div>'+
      '<button id="addBtn" class="wide" style="margin-top:14px">+ Aggiungi giocatore</button>'+
      '<div class="players" id="pl"></div>'+
      '<p class="hint" id="hint"></p>'+
    '</div></div><div>'+
    '<div class="card">'+
      '<h2>📱 Schermo</h2>'+
      '<div class="switch" id="lay">'+[['auto','Automatico'],['v','Verticale'],['h','Orizzontale']].map(function(o){
        return '<button data-l="'+o[0]+'" class="'+(LAY===o[0]?'on':'')+'">'+o[1]+'</button>';}).join('')+'</div>'+
      '<p class="hint" style="margin-top:6px">Orizzontale: tabellone e domanda affiancati, comodo su tablet o telefono girato.</p>'+
    '</div>'+
    '<div class="card">'+
      '<h2>⏱️ Tempo per rispondere</h2>'+
      '<div class="switch"><button id="tOff" class="'+(TM.on?'':'on')+'">Senza timer</button><button id="tOn" class="'+(TM.on?'on':'')+'">Con timer</button></div>'+
      '<div class="tbody'+(TM.on?'':' off')+'" id="tbody">'+GA.map(function(g){
        return '<div class="trow"><span class="em" style="font-size:1.4rem">'+g.e+'</span><span class="tl">'+g.n+'<small>'+g.a+'</small></span>'+
          '<button class="step" data-k="'+g.k+'" data-d="-5" aria-label="Meno tempo">−</button><span class="v" id="tv_'+g.k+'">'+TM.s[g.k]+' s</span>'+
          '<button class="step" data-k="'+g.k+'" data-d="5" aria-label="Più tempo">+</button></div>';
      }).join('')+'</div>'+
      '<p class="hint">Se il tempo finisce prima della risposta, la domanda conta come sbagliata.</p>'+
    '</div>'+
    '</div></div>'+
    '<button id="goBtn" class="wide cta">▶ Inizia la partita!</button>'
  );

  function setTM(on){TM.on=on;saveTM();document.getElementById('tOn').classList.toggle('on',on);document.getElementById('tOff').classList.toggle('on',!on);document.getElementById('tbody').classList.toggle('off',!on);}
  document.querySelectorAll('#lay button').forEach(function(b){
    b.addEventListener('click',function(){
      LAY=b.dataset.l;try{localStorage.setItem('tq_layout',LAY)}catch(e){}
      document.querySelectorAll('#lay button').forEach(function(x){x.classList.toggle('on',x===b);});
      applyLay();
    });
  });
  document.getElementById('tOn').addEventListener('click',function(){setTM(true);});
  document.getElementById('tOff').addEventListener('click',function(){setTM(false);});
  document.querySelectorAll('.step').forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.dataset.k;TM.s[k]=Math.max(5,Math.min(120,TM.s[k]+(+b.dataset.d)));saveTM();
      document.getElementById('tv_'+k).textContent=TM.s[k]+' s';
    });
  });

  document.querySelectorAll('.age').forEach(function(b){
    b.addEventListener('click',function(){
      lastAge=b.dataset.k;
      try{localStorage.setItem("tq_age",lastAge)}catch(e){}
      document.querySelectorAll('.age').forEach(function(x){x.classList.toggle('on',x===b);});
    });
  });

  function renderList(){
    document.getElementById('pl').innerHTML=S.ps.map(function(p,i){
      return '<div class="pchip">'+avHTML(p,i)+
        '<span class="nm">'+esc(p.n)+'<small>'+G[p.g]+'</small></span>'+
        '<button class="x" data-i="'+i+'" aria-label="Togli '+esc(p.n)+'">✕</button>'+
      '</div>';
    }).join('');
    document.getElementById('hint').textContent=S.ps.length?'':'Aggiungi da 1 a 6 giocatori: ognuno ha domande adatte alla sua età.';
    document.querySelectorAll('#pl .x').forEach(function(b){
      b.addEventListener('click',function(){
        S.ps.splice(+b.dataset.i,1);
        S.ps.forEach(function(p,i){p.av=AV[i];});
        renderList();
      });
    });
  }

  document.getElementById('addBtn').addEventListener('click',function(){
    var nm=document.getElementById('nm');
    if(!nm.value.trim()){nm.focus();return;}
    if(S.ps.length>=6)return;
    S.ps.push({n:nm.value.trim(),g:lastAge,av:AV[S.ps.length],pos:0,w:[],s:0});
    nm.value='';
    renderList();
    nm.focus();
  });

  document.getElementById('nm').addEventListener('keydown',function(e){
    if(e.key==='Enter')document.getElementById('addBtn').click();
  });

  document.getElementById('goBtn').addEventListener('click',function(){
    if(!S.ps.length){document.getElementById('nm').focus();document.getElementById('hint').textContent='Aggiungi almeno un giocatore!';return;}
    S.ps.forEach(function(p,i){p.av=AV[i];p.pos=0;p.w=[];p.s=0;});
    S.t=0;
    turn();
  });

  renderList();
}

// ── TURN: ROLL ────────────────────────────────────────────────────────────
function turn(){
  stopTimer();
  if(checkWin())return;
  var p=S.ps[S.t];

  render(
    brand(true)+
    '<div class="cols"><div>'+boardSVG()+'</div><div>'+
    '<div class="card turn pop">'+
      '<div class="who">'+avHTML(p,S.t)+'<span>Tocca a '+esc(p.n)+'</span></div>'+
      dieHTML(6,'die')+
      '<button id="rollBtn" class="wide cta">Tira il dado!</button>'+
    '</div>'+
    scoreBar()+
    '<button class="sec wide" id="endBtn" style="margin-top:14px">Termina partita</button>'+
    '</div></div>'
  );

  document.getElementById('endBtn').addEventListener('click',function(){end();});
  document.getElementById('rollBtn').addEventListener('click',function(){
    var btn=this;
    btn.disabled=true;btn.textContent='…';
    var die=document.getElementById('die');
    die.classList.add('roll');
    var n=0;
    var iv=setInterval(function(){
      setDie(die,1+Math.floor(Math.random()*6));
      if(++n>10){
        clearInterval(iv);
        die.classList.remove('roll');
        var roll=1+Math.floor(Math.random()*6);
        setDie(die,roll);
        btn.textContent='Hai fatto '+roll+'!';
        p.pos=(p.pos+roll)%24;
        setTimeout(function(){ask(roll);},750);
      }
    },80);
  });
}

// ── TURN: QUESTION ────────────────────────────────────────────────────────
function ask(roll){
  var p=S.ps[S.t];
  var cat=catAt(p.pos);
  var isWedge=(p.pos%4===0);
  var data=pick(p.g,cat.k);
  S.cur={p:p,cat:cat,data:data,roll:roll,isWedge:isWedge,chosen:null};
  showQ();
}

function showQ(){
  stopTimer();
  var c=S.cur,p=c.p,cat=c.cat,data=c.data;
  var answered=(c.chosen!==null);
  var timedOut=(c.chosen===-1);
  var limit=TM.on?TM.s[p.g]:0;
  if(limit&&!answered&&!c.deadline)c.deadline=Date.now()+limit*1000;
  var kid=(p.g==='p'||p.g==='b');
  var j=S.ps.indexOf(p);

  var optsHtml=data.opts.map(function(o,i){
    var cls='opt';
    if(answered){
      if(o.ok)cls+=' ok';
      else if(i===c.chosen)cls+=' ko';
      else cls+=' dim';
    }
    var k=answered&&o.ok?'✓':answered&&i===c.chosen?'✗':'ABC'[i];
    return '<button class="'+cls+'" data-i="'+i+'"'+(answered?' disabled':'')+'><span class="k">'+k+'</span><span>'+esc(o.t)+'</span></button>';
  }).join('');

  var feedbackHtml='';
  if(answered){
    var correct=!timedOut&&data.opts[c.chosen].ok;
    var gotWedge=correct&&c.isWedge&&p.w.indexOf(cat.k)>=0&&c.newWedge;
    feedbackHtml=
      '<div class="res">'+(correct
        ?'🎉 Esatto! +10 punti'+(gotWedge?'<br>Hai conquistato lo spicchio '+cat.e+'!':'')
        :(timedOut?'⏰ Tempo scaduto! Tocca al prossimo':'😅 Non è giusto… tocca al prossimo'))+'</div>'+
      '<div class="fact">💡 '+esc(data.fact)+'</div>'+
      '<button id="nxtBtn" class="wide cta" style="margin-top:14px">'+
        (p.w.length>=6?'🏆 Vedi il vincitore':correct?'Tira ancora!':'Avanti ➜')+'</button>';
  }

  render(
    '<div class="'+(kid?'kid':'')+'">'+
    brand(true)+
    '<div class="cols q"><div class="qside">'+boardSVG(true)+
    '<div class="tools"><button class="sec" id="speakBtn">🔊 Leggi ad alta voce</button></div>'+
    '</div><div>'+
    '<div class="card qcard pop">'+
      '<div class="qhead" style="background:'+cat.c+'"><span>'+esc(catLabel(cat,p.g))+'</span>'+(c.isWedge?'<span class="badge">⭐ Spicchio</span>':'')+'</div>'+
      '<div class="qbody">'+
        '<div class="meta">'+p.av+' '+esc(p.n)+' · dado '+c.roll+'</div>'+
        '<div class="qtext">'+esc(data.q)+'</div>'+
        (limit&&!answered?'<div class="tmr" id="tmr"><span class="bar"><i id="tbar"></i></span><b id="tsec">'+limit+'</b></div>':'')+
        optsHtml+
        feedbackHtml+
      '</div>'+
    '</div>'+
    '</div></div>'+
    '</div>'
  );
  if(answered){
    var ok=!timedOut&&data.opts[c.chosen].ok;
    if(ok&&!c.celebrated){c.celebrated=true;confetti();}
    var nb=document.getElementById('nxtBtn');if(nb)nb.scrollIntoView({block:'nearest',behavior:'smooth'});
  }

  // Timer
  if(limit&&!answered){
    var tick=function(){
      var left=Math.max(0,c.deadline-Date.now());
      var bar=document.getElementById('tbar'),sec=document.getElementById('tsec'),box=document.getElementById('tmr');
      if(bar){bar.style.width=(left/(limit*10))+'%';sec.textContent=Math.ceil(left/1000);box.classList.toggle('low',left<=5000);}
      if(left<=0){stopTimer();c.chosen=-1;showQ();}
    };
    tick();timerIv=setInterval(tick,200);
  }

  // Option listeners
  if(!answered){
    document.querySelectorAll('.opt').forEach(function(b){
      b.addEventListener('click',function(){
        c.chosen=+b.dataset.i;
        var correct=data.opts[c.chosen].ok;
        if(correct){
          p.s+=10;
          if(c.isWedge&&p.w.indexOf(cat.k)<0){p.w.push(cat.k);c.newWedge=true;}
        }
        showQ();
      });
    });
  }

  // Next button
  var nxt=document.getElementById('nxtBtn');
  if(nxt){
    nxt.addEventListener('click',function(){
      if(p.w.length>=6){end(p);return;}
      var correct=c.chosen>=0&&data.opts[c.chosen].ok;
      if(!correct)S.t=(S.t+1)%S.ps.length;
      turn();
    });
  }

  // TTS
  document.getElementById('speakBtn').addEventListener('click',function(){
    try{
      speechSynthesis.cancel();
      var txt=data.q+'. '+data.opts.map(function(o){return o.t;}).join('. ');
      var u=new SpeechSynthesisUtterance(txt);
      u.lang='it-IT';speechSynthesis.speak(u);
    }catch(e){}
  });
}

// ── WIN CHECK ─────────────────────────────────────────────────────────────
function checkWin(){
  for(var i=0;i<S.ps.length;i++){
    if(S.ps[i].w.length>=6){end(S.ps[i]);return true;}
  }
  return false;
}

// ── END SCREEN ────────────────────────────────────────────────────────────
function end(winner){
  stopTimer();
  var sorted=S.ps.slice().sort(function(a,b){return b.w.length-a.w.length||b.s-a.s;});
  var medals=["🥇","🥈","🥉"];
  render(
    brand(true)+
    '<div class="card" style="text-align:center">'+
      '<h2 style="font-size:1.7rem;margin:0">🏆 Classifica</h2>'+
      (winner?'<p style="font-weight:800;margin-top:6px">'+winner.av+' '+esc(winner.n)+' ha conquistato tutti gli spicchi!</p>':'')+
    '</div>'+
    '<div class="cols"><div>'+
    '<div class="card">'+
      sorted.map(function(p,i){
        return '<div class="rank"><span class="md">'+(medals[i]||'⭐')+'</span>'+
          ringSVG(p.w,p.av)+
          '<span class="nm">'+esc(p.n)+'</span><b>'+p.s+' pt</b></div>';
      }).join('')+
    '</div>'+
    '</div><div style="padding-top:10px">'+
    '<button id="againBtn" class="wide cta">🔁 Rivincita!</button>'+
    '<button class="sec wide" id="newBtn" style="margin-top:10px">👥 Cambia giocatori</button>'+
    '</div></div>'
  );
  if(winner)confetti();
  document.getElementById('againBtn').addEventListener('click',function(){
    S.ps.forEach(function(p){p.pos=0;p.w=[];p.s=0;});
    S.t=0;turn();
  });
  document.getElementById('newBtn').addEventListener('click',function(){
    S.ps=[];setup();
  });
}

// ── LAYOUT (verticale / orizzontale) ──────────────────────────────────────
var LAY='auto';try{LAY=localStorage.getItem('tq_layout')||'auto'}catch(e){}
var DBN=0;
function applyLay(){
  var land=LAY==='h'||(LAY==='auto'&&innerWidth>innerHeight&&innerWidth>=640);
  document.body.classList.toggle('land',land);
}
addEventListener('resize',applyLay);applyLay();

// ── START ─────────────────────────────────────────────────────────────────
render(brand()+'<div class="card" style="text-align:center">Carico le domande…</div>');
fetch('trivia_database.json',{cache:'no-cache'})
  .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
  .then(function(d){DB=d;DBN=Object.keys(d).reduce(function(s,g){return s+Object.keys(d[g]).reduce(function(a,c){return a+d[g][c].length;},0);},0);setup();})
  .catch(function(){
    render(brand()+'<div class="card" style="text-align:center"><h2>Non riesco a caricare le domande 😕</h2>'+
      '<p style="margin-top:8px">Il file <b>trivia_database.json</b> deve stare nella stessa cartella di questa pagina. '+
      'Se hai aperto la pagina facendo doppio clic sul file, aprila invece dall’indirizzo online.</p></div>');
  });
</script>
</body>
</html>
