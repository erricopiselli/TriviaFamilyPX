<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TriviaFamilyPX</title>
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trivia">
<meta name="theme-color" content="#1f3b63">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;700;800&family=Mulish:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* tabellone: cartoncino crema, blu notte e i sei colori classici delle categorie */
  --bg1:#f6eedb;--bg2:#e9dcbd;--card:#fffdf6;--card2:#f3ecdb;--tx:#1b2b40;--mut:#5f6b78;
  --pri:#1f4e8c;--pri2:#13345f;--ok:#2f9e44;--ko:#d6453d;--bd:#dccfae;--track:#e7dcc2;
  --gold:#e8b10f;
  --ff-d:"Roboto Slab",Rockwell,Georgia,serif;
  --ff-b:"Mulish","Segoe UI",system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#13233a;--bg2:#0b1626;--card:#182c45;--card2:#203853;--tx:#f3ead4;
    --mut:#a9b4c2;--pri:#3d7bd9;--pri2:#24508f;--ok:#43b45a;--ko:#ef6a5f;--bd:#2d4664;--track:#24395a;
  }
}
:root[data-theme="dark"]{
  --bg1:#13233a;--bg2:#0b1626;--card:#182c45;--card2:#203853;--tx:#f3ead4;
  --mut:#a9b4c2;--pri:#3d7bd9;--pri2:#24508f;--ok:#43b45a;--ko:#ef6a5f;--bd:#2d4664;--track:#24395a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--bg2)}
body{
  min-height:100vh;
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
  color:var(--tx);font-family:var(--ff-b);font-size:17px;line-height:1.45;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
#app{max-width:560px;margin:0 auto;padding:14px 16px 28px}
h1,h2,.disp{font-family:var(--ff-d);font-weight:700;letter-spacing:-.3px}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 2px}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{font-size:1.9rem;line-height:1}
.brand.sm svg{width:30px;height:30px}
.brand.sm h1{font-size:1.35rem}
.sub{text-align:center;color:var(--mut);font-weight:700;margin:6px 0 4px}
.card{
  background:var(--card);border-radius:24px;padding:18px;margin:14px 0;
  box-shadow:0 2px 0 var(--bd),0 10px 30px rgba(60,30,120,.08);
}
h2{font-size:1.35rem;margin-bottom:10px}
.lbl{font-weight:800;font-size:.85rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px}
input{
  font:inherit;font-weight:700;padding:12px 14px;border-radius:14px;border:2px solid var(--bd);
  background:var(--card2);color:var(--tx);width:100%;outline:none;
}
input:focus{border-color:var(--pri)}
button{
  font:inherit;font-family:var(--ff-d);font-weight:600;cursor:pointer;border:0;border-radius:16px;
  padding:13px 18px;background:var(--pri);color:#fff;font-size:1.05rem;
  box-shadow:0 4px 0 var(--pri2);transition:transform .08s,box-shadow .08s,background .2s;
  -webkit-tap-highlight-color:transparent;
}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri2)}
button:disabled{cursor:default}
button.sec{background:transparent;color:var(--tx);border:2px solid var(--bd);box-shadow:none}
button.wide{width:100%}
button.cta{font-size:1.2rem;padding:15px}
.ages{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.age{
  background:var(--card2);color:var(--tx);box-shadow:none;border:2px solid transparent;
  display:flex;align-items:center;gap:8px;padding:10px 12px;text-align:left;font-size:.98rem;
}
.age .em{font-size:1.5rem}
.age small{display:block;font-family:var(--ff-b);font-weight:700;color:var(--mut);font-size:.78rem}
.age.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,var(--card))}
.players{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pchip{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:16px;padding:8px 8px 8px 10px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;flex:none;background:var(--card);box-shadow:inset 0 0 0 3px var(--ring,var(--bd))}
.pchip .nm{font-weight:800;flex:1;min-width:0}
.pchip .nm small{display:block;color:var(--mut);font-weight:700;font-size:.8rem}
.x{padding:6px 11px;font-size:.9rem;box-shadow:none;background:transparent;color:var(--mut);border:2px solid var(--bd)}
.hint{color:var(--mut);font-size:.9rem;text-align:center;margin-top:10px}
.ver{text-align:center;color:var(--mut);font-size:.75rem;font-weight:700;opacity:.8;margin:2px 0 0}
.cols>*{min-width:0}
.cols.q{display:flex;flex-direction:column}
.cols.q .qside{display:contents}
.cols.q .qside .tools{order:3}
body.land .cols.q{display:grid}
body.land .cols.q .qside{display:block}
body.land #app{max-width:1100px;padding:10px 20px 18px}
body.land .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
body.land .cols.q{grid-template-columns:minmax(200px,30%) 1fr}
body.land .cols .card{margin:10px 0}
body.land .brand{margin:2px 0}
body.land .board{max-width:min(300px,68vh)}
body.land .board.small{max-width:min(220px,52vh)}
body.land .opt{margin-top:8px;padding:10px 14px}
body.land .kid .opt{padding:12px 14px}
body.land .qtext{font-size:1.2rem}
body.land .kid .qtext{font-size:1.45rem}
body.land .qside .tools{justify-content:center;margin-top:10px}
/* Board */
.board{position:relative;width:100%;max-width:360px;margin:4px auto 0}
.board svg{display:block;width:100%;height:auto}
.board.small{max-width:230px}
/* Turn */
.turn{text-align:center}
.turn .who{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--ff-d);font-size:1.35rem;font-weight:600}
.die{
  width:84px;height:84px;margin:14px auto 12px;border-radius:20px;background:#fff;position:relative;
  box-shadow:inset 0 -6px 0 #e7e0f5,0 6px 16px rgba(60,30,120,.18);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12px;
}
.die i{width:14px;height:14px;border-radius:50%;background:#2b2540;place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.die.roll{animation:roll .45s ease-in-out infinite}
@keyframes roll{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(-18deg) translateY(-8px)}50%{transform:rotate(12deg) translateY(0)}75%{transform:rotate(-8deg) translateY(-4px)}100%{transform:rotate(0)}}
.scores{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px}
.sc{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:99px;padding:4px 10px 4px 4px;font-weight:800;font-size:.9rem;box-shadow:0 2px 0 var(--bd)}
.sc.now{outline:2px solid var(--pri)}
.sc svg{width:26px;height:26px}
/* Question */
.qcard{padding:0;overflow:hidden}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;color:#fff;font-family:var(--ff-d);font-weight:600}
.qhead .badge{background:#fff;color:var(--tx);border-radius:99px;padding:2px 10px;font-size:.8rem;font-family:var(--ff-b);font-weight:800;white-space:nowrap}
.qbody{padding:16px}
.qtext{font-family:var(--ff-d);font-weight:600;font-size:1.32rem;line-height:1.3}
.kid .qtext{font-size:1.6rem}
.meta{display:flex;align-items:center;gap:6px;color:var(--mut);font-weight:800;font-size:.85rem;margin-bottom:8px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:10px 0 0;
  background:var(--card2);color:var(--tx);box-shadow:0 3px 0 var(--bd);font-family:var(--ff-b);font-weight:800;font-size:1.05rem;padding:12px 14px;
}
.kid .opt{font-size:1.25rem;padding:15px 14px}
.opt .k{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--mut);font-family:var(--ff-d);flex:none;font-size:.95rem}
.opt.ok{background:var(--ok);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--ok) 70%,#000)}
.opt.ko{background:var(--ko);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--ko) 70%,#000);animation:shake .4s}
.opt.ok .k,.opt.ko .k{background:rgba(255,255,255,.25);color:#fff}
.opt.dim{opacity:.5}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.res{font-family:var(--ff-d);font-weight:700;font-size:1.3rem;margin-top:16px}
.fact{background:var(--card2);border-radius:14px;padding:12px;margin-top:10px;font-size:.98rem;font-weight:700}
.tools{display:flex;gap:8px;margin-top:2px}
.pop{animation:pp .35s}
.tmr{display:flex;align-items:center;gap:10px;margin:12px 0 2px}
.tmr .bar{flex:1;height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.tmr .bar i{display:block;height:100%;width:100%;background:var(--ok);border-radius:99px;transition:width .2s linear,background .3s}
.tmr b{font-family:var(--ff-d);font-size:1.1rem;min-width:44px;text-align:right}
.tmr.low .bar i{background:var(--ko)}.tmr.low b{color:var(--ko)}
.trow{display:flex;align-items:center;gap:10px;padding:6px 0}
.trow .tl{flex:1;font-weight:800}
.trow .tl small{display:block;color:var(--mut);font-weight:700;font-size:.8rem}
.step{width:38px;height:38px;padding:0;border-radius:12px;font-size:1.2rem;background:var(--card2);color:var(--tx);box-shadow:none}
.trow .v{font-family:var(--ff-d);font-weight:700;font-size:1.1rem;min-width:52px;text-align:center}
.switch{display:flex;gap:6px;background:var(--card2);border-radius:14px;padding:4px;margin-bottom:6px}
.switch button{flex:1;background:transparent;color:var(--tx);box-shadow:none;padding:9px;font-size:.98rem}
.switch button.on{background:var(--pri);color:#fff}
.tbody.off{opacity:.4;pointer-events:none}
@keyframes pp{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
/* End */
.rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px dashed var(--bd)}
.rank:last-child{border:0}
.rank .md{font-size:1.6rem;width:34px;text-align:center}
.rank .nm{flex:1;font-weight:800;font-size:1.1rem}
.rank svg{width:34px;height:34px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.scov{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--bg2) 92%,transparent);display:flex;align-items:center;justify-content:center;padding:4vh 4vw}
.scov .rank svg{width:42px;height:42px}
/* ── TV / desktop in orizzontale ── */
button:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid #ffc83d;outline-offset:3px}
.opt:focus-visible{transform:scale(1.02)}
.kh{display:none}
.tvtools{display:flex;gap:8px;justify-content:center;margin-top:10px}
body.land #app{max-width:1500px;padding:8px max(16px,2vw) 14px}
body.land .cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:3vw;align-items:center}
body.land .cols.q{grid-template-columns:minmax(0,34%) minmax(0,1fr)}
body.land .board{max-width:min(620px,74vh)}
body.land .board.small{max-width:min(460px,58vh)}
body.land .brand.sm h1{font-size:clamp(1.2rem,3vh,2rem)}
body.land .brand.sm svg{width:clamp(28px,4vh,48px);height:clamp(28px,4vh,48px)}
body.land .turn .who{font-size:clamp(1.3rem,3.6vh,2.6rem)}
body.land .turn .av{width:1.7em;height:1.7em;font-size:1em}
body.land .die{width:clamp(84px,16vh,170px);height:clamp(84px,16vh,170px);padding:clamp(12px,2.2vh,24px)}
body.land .die i{width:clamp(14px,2.6vh,28px);height:clamp(14px,2.6vh,28px)}
body.land button.cta{font-size:clamp(1.2rem,3.2vh,2.2rem);padding:1.6vh 1.2vw}
body.land .sc{font-size:clamp(.9rem,2.1vh,1.5rem)}
body.land .sc svg{width:1.8em;height:1.8em}
body.land .qhead{font-size:clamp(1rem,2.6vh,1.8rem);padding:1.4vh 1.4vw}
body.land .qbody{padding:2vh 1.6vw}
body.land .meta{font-size:clamp(.85rem,2vh,1.3rem)}
body.land .qtext,body.land .kid .qtext{font-size:clamp(1.25rem,4vh,2.8rem)}
body.land .opt,body.land .kid .opt{font-size:clamp(1rem,3.2vh,2.3rem);padding:1.5vh 1.2vw;margin-top:1.2vh}
body.land .opt .k{width:1.8em;height:1.8em;font-size:.85em}
body.land .res{font-size:clamp(1.2rem,3.2vh,2.3rem);margin-top:1.6vh}
body.land .fact{font-size:clamp(.95rem,2.5vh,1.7rem);padding:1.4vh 1.2vw}
body.land .tmr b{font-size:clamp(1.1rem,3vh,2rem)}
body.land .tmr .bar{height:clamp(10px,1.4vh,18px)}
body.land .kh{display:block;text-align:center;color:var(--mut);font-weight:700;font-size:clamp(.8rem,1.8vh,1.2rem);margin-top:1.2vh}
body.land .tools button,body.land .tvtools button{font-size:clamp(.9rem,2vh,1.4rem)}
.devs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.dev{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 10px;background:var(--card);color:var(--tx);box-shadow:0 4px 0 var(--bd);border-radius:22px;font-size:1.15rem}
.dev .big{font-size:2.6rem;line-height:1}
.dev small{font-family:var(--ff-b);font-weight:700;color:var(--mut);font-size:.8rem}
.dev.on{outline:3px solid var(--pri)}
body.land .devs{grid-template-columns:repeat(4,minmax(0,1fr))}
body.land .dev{font-size:clamp(1rem,2.6vh,1.8rem);padding:4vh 1vw}
body.land .dev .big{font-size:clamp(2.4rem,8vh,5rem)}
.qrbox{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap}
.qrbox svg{width:min(60vw,42vh,320px);height:auto;background:#fff;border-radius:14px;padding:8px}
.code{font-family:var(--ff-d);font-weight:700;font-size:clamp(1.6rem,6vh,3.4rem);letter-spacing:.2em}
.castb{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:.9rem;margin:8px auto 0;background:var(--card);border-radius:99px;padding:4px 14px;width:max-content;max-width:100%;box-shadow:0 2px 0 var(--bd)}
.castb svg{width:64px;height:64px;background:#fff;border-radius:6px;padding:2px}
.rc{max-width:560px;margin:0 auto}
.rc .rbar{font-weight:800;color:var(--mut);font-size:.85rem;text-align:center;margin:4px 0}
.rc .rt{font-family:var(--ff-d);font-weight:700;font-size:1.3rem;text-align:center;margin:8px 0 4px}
.rc .rm{text-align:center;font-weight:700;margin-bottom:8px;min-height:1.2em}
.rc .rgl{font-weight:800;font-size:.8rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px}
.rc .rbtns{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.rc .rbtns.sw{flex-direction:row;flex-wrap:wrap}
.rc .rbtns.sw button{flex:1;padding:10px 6px;background:var(--card2);color:var(--tx);box-shadow:none}
.rc .rbtns.sw button.on{background:var(--pri);color:#fff}
.rc input{margin-top:8px}
.rst{font-size:.8rem;font-weight:800;text-align:center;color:var(--mut)}
.rst.ok{color:var(--ok)}
/* look da gioco da tavolo */
body{background:radial-gradient(circle at 20% 0%,rgba(255,255,255,.55),transparent 45%),repeating-linear-gradient(45deg,rgba(27,43,64,.025) 0 2px,transparent 2px 9px),linear-gradient(170deg,var(--bg1),var(--bg2)) fixed}
h1,h2,.disp,.qtext,.res,.who,button{letter-spacing:0}
.brand h1{font-weight:800;color:var(--pri2)}
.card{border:2px solid var(--bd);box-shadow:0 3px 0 var(--bd),0 14px 30px rgba(27,43,64,.10);border-radius:18px}
button{border-radius:12px}
.qcard{border-width:0}
.qhead{font-weight:700;letter-spacing:.02em;text-transform:uppercase;font-size:.95rem}
.qtext{font-weight:700}
.opt{border:2px solid var(--bd);box-shadow:0 3px 0 var(--bd)}
.opt .k{font-family:var(--ff-d);font-weight:800}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand h1{color:var(--tx)}}
:root[data-theme="dark"] .brand h1{color:var(--tx)}
/* dado 3D */
.dov{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;background:rgba(9,20,36,.55);backdrop-filter:blur(2px)}
.dt{font-family:var(--ff-d);font-weight:800;color:#fff;font-size:clamp(1.3rem,4vh,2.6rem);text-shadow:0 2px 6px rgba(0,0,0,.4)}
.table{position:relative;width:min(92vw,120vh);height:min(52vh,70vw);border-radius:28px;background:radial-gradient(ellipse at 50% 40%,#2f7d5a,#17523a 70%,#0f3d2b);box-shadow:inset 0 0 0 10px #6b4423,inset 0 0 0 14px #8a5a2b,inset 0 10px 40px rgba(0,0,0,.45),0 20px 50px rgba(0,0,0,.4);perspective:900px;overflow:hidden}
.die3{--ds:min(22vh,26vw,170px);position:absolute;left:50%;top:50%;width:var(--ds);height:var(--ds);margin:calc(var(--ds)/-2) 0 0 calc(var(--ds)/-2);transform-style:preserve-3d}
.die3 .f{position:absolute;inset:0;background:linear-gradient(145deg,#fffdf6,#efe6d2);border-radius:18%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.06),inset 0 -6px 12px rgba(0,0,0,.08);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%;backface-visibility:hidden}
.die3 .f i{width:62%;height:62%;border-radius:50%;background:#1b2b40;place-self:center;visibility:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.5)}
.die3 .f i.on{visibility:visible}
.die3 .f1 i.on{background:#d6453d}
.dshadow{position:absolute;left:50%;top:50%;width:min(22vh,26vw,170px);height:30px;margin-left:calc(min(22vh,26vw,170px)/-2);border-radius:50%;background:rgba(0,0,0,.35);filter:blur(8px)}
.dres{font-family:var(--ff-d);font-weight:800;color:#fff;font-size:clamp(1.6rem,6vh,3.6rem);min-height:1.3em;text-shadow:0 2px 8px rgba(0,0,0,.45)}
/* immagini per i più piccoli */
.qpic{font-size:clamp(3rem,10vh,6rem);text-align:center;line-height:1.1;margin:4px 0 6px}
.pic{flex:none;display:grid;place-items:center;min-width:2.1em;height:2.1em;font-size:1.5em;line-height:1}
.pic .sw{width:1.5em;height:1.5em;border-radius:50%;border:3px solid rgba(0,0,0,.15)}
.pic .dots{font-size:.42em;line-height:1.05;letter-spacing:.05em;text-align:center;max-width:3.2em;word-break:break-all;color:var(--pri)}
.pic .big{font-family:var(--ff-d);font-weight:800;font-size:1.1em}
.kid .opt{gap:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── CATEGORIES ──────────────────────────────────────────────────────────
var C=[
  {k:"an",n:"Animali & Natura",e:"🐾",c:"#2f9e44"},
  {k:"sc",n:"Scienza & Logica",  e:"🔬",c:"#8a5a2b"},
  {k:"ge",n:"Geografia",        e:"🌍",c:"#1f6fd1"},
  {k:"st",n:"Storia & Arte",    e:"🏛️",c:"#e8b10f",dark:true},
  {k:"ca",n:"Cinema & Cartoni", e:"🎬",c:"#df3f7e"},
  {k:"vg",n:"Videogiochi & Sport",e:"🎮",c:"#ec7417"}

function esc(s){
  return String(s).replace(/[&<>"]/g,function(c){
    return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

function catAt(pos){return pos%4===0?C[pos/4]:C[pos%6]}
function f1(n){return n.toFixed(1)}
// Arc segment of a ring between angles (degrees, 0 = top)
function arc(cx,cy,r1,r2,a0,a1){
  function pt(a,r){a=(a-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
  var p0=pt(a0,r2),p1=pt(a1,r2),p2=pt(a1,r1),p3=pt(a0,r1),lg=(a1-a0)>180?1:0;
  return 'M'+f1(p0[0])+' '+f1(p0[1])+'A'+r2+' '+r2+' 0 '+lg+' 1 '+f1(p1[0])+' '+f1(p1[1])+
    'L'+f1(p2[0])+' '+f1(p2[1])+'A'+r1+' '+r1+' 0 '+lg+' 0 '+f1(p3[0])+' '+f1(p3[1])+'Z';
}

}

// ── QUESTION PICKER ───────────────────────────────────────────────────────
function pick(fascia,catKey){
  var pool=DB[fascia][catKey];
  var key=fascia+":"+catKey;
  var used=USED[key]||[];
  var avail=[];
  for(var i=0;i<pool.length;i++){if(used.indexOf(i)<0)avail.push(i);}
  if(!avail.length){used=[];for(var i=0;i<pool.length;i++)avail.push(i);}
  var idx=avail[Math.floor(Math.random()*avail.length)];
  used.push(idx);
  USED[key]=used;
  saveUsed();
  var q=pool[idx];
  // q = [domanda, corretta, sbagliata1, sbagliata2, curiosità]
  var opts=shuffle([{t:q[1],ok:true},{t:q[2]},{t:q[3]}]);
  return {q:q[0],opts:opts,fact:q[4],cat:catKey};
}

function boardSVG(small){
  var cx=180,cy=180,R1=118,R2=162;
  var s='<svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tabellone">';
  for(var i=0;i<24;i++){
    var cat=catAt(i),big=(i%4===0);
    var a0=i*15+1.3,a1=(i+1)*15-1.3;
    s+='<path d="'+arc(cx,cy,big?R1-8:R1,big?R2+6:R2,a0-7.5,a1-7.5)+'" fill="'+cat.c+'"'+(big?'':' opacity=".82"')+'/>';
    if(big){
      var a=(i*15-90)*Math.PI/180,rm=(R1+R2)/2;
      var x=cx+rm*Math.cos(a),y=cy+rm*Math.sin(a);
      s+='<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="15" fill="#fff"/>'+
         '<text x="'+f1(x)+'" y="'+f1(y+5.5)+'" text-anchor="middle" font-size="16">'+cat.e+'</text>';
    }
  }
  // Player tokens (on the track)
  S.ps.forEach(function(p,j){
    var a=(p.pos*15-90)*Math.PI/180;
    var r=R1-22-(j%3)*15;
    var x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);
    var active=(j===S.t);
    s+='<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+(active?15:12)+'" fill="#fff" stroke="'+AVC[j%6]+'" stroke-width="'+(active?4:3)+'"/>'+
       '<text x="'+f1(x)+'" y="'+f1(y+(active?6:5))+'" text-anchor="middle" font-size="'+(active?17:13)+'">'+p.av+'</text>';
  });
  // Center: current player + wedge progress
  var cp=S.ps[S.t];

    C.forEach(function(c,i){
      var has=cp.w.indexOf(c.k)>=0;
      s+='<path d="'+arc(cx,cy,40,62,i*60+3,(i+1)*60-3)+'" fill="'+(has?c.c:'var(--track)')+'"/>';

       '<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-size="40">'+cp.av+'</text>';

var SND=true;try{SND=localStorage.getItem('tq_snd')!=='0';}catch(e){}
var AC=null,NOISE=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC.state==='suspended')AC.resume();return AC;}
function tone(fq,d,type,vol,when){if(!SND)return;var a=ac();if(!a)return;var t=a.currentTime+(when||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=fq;g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);}
function tac(when,vol,freq){
  if(!SND)return;var a=ac();if(!a)return;
  if(!NOISE){NOISE=a.createBuffer(1,Math.floor(a.sampleRate*.03),a.sampleRate);var d=NOISE.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4);}
  var t=a.currentTime+(when||0),src=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();
  src.buffer=NOISE;bp.type='bandpass';bp.frequency.value=freq||1800;bp.Q.value=1.1;g.gain.value=vol||.22;
  src.connect(bp);bp.connect(g);g.connect(a.destination);src.start(t);
}
function thud(when,vol){
  if(!SND)return;var a=ac();if(!a)return;
  if(!NOISE)tac(0,0);
  var t=a.currentTime+(when||0),src=a.createBufferSource(),lp=a.createBiquadFilter(),g=a.createGain();
  src.buffer=NOISE;lp.type='lowpass';lp.frequency.value=900;g.gain.value=vol||.5;
  src.connect(lp);lp.connect(g);g.connect(a.destination);src.start(t);
  var o=a.createOscillator(),og=a.createGain();o.type='sine';o.frequency.setValueAtTime(190,t);o.frequency.exponentialRampToValueAtTime(70,t+.08);
  og.gain.setValueAtTime((vol||.5)*.7,t);og.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(og);og.connect(a.destination);o.start(t);o.stop(t+.12);
  tac(when+.005,(vol||.5)*.35,3200);
}
function sfx(n){
  if(!SND)return;
  if(n==='ok'){tone(880,.25,'sine',.18);tone(1320,.3,'sine',.1,.07);}
  else if(n==='no'){tone(220,.3,'sawtooth',.1);tone(160,.45,'sawtooth',.09,.18);}
  else if(n==='buzz'){tone(95,.7,'sawtooth',.22);tone(100,.7,'square',.08);}
  else if(n==='wedge'){[523,659,784,1047].forEach(function(fq,i){tone(fq,.35,'triangle',.17,i*.1);});}
  else if(n==='win'){[523,659,784,1047,784,1047,1319].forEach(function(fq,i){tone(fq,.4,'triangle',.16,i*.12);});}
  else if(n==='tick'){tone(1200,.05,'square',.05);}
  else if(n==='go'){tone(660,.12,'triangle',.14);tone(990,.18,'triangle',.12,.1);}
}

function toggleFS(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(e){}}
function focusables(){return Array.prototype.filter.call(app.querySelectorAll('button:not(:disabled),input,summary'),function(e){return e.offsetParent!==null;});}
function focusFirst(){
  var a=document.activeElement;if(a&&a!==document.body&&app.contains(a))return;
  var el=app.querySelector('#nxtBtn,#rollBtn:not(:disabled),.opt:not(:disabled),#goBtn,#againBtn');
  if(el)try{el.focus({preventScroll:true});}catch(e){}

// frecce del telecomando / tastiera: sposta il focus verso il pulsante più vicino
function nav(dir){
  var items=focusables(),a=document.activeElement;
  if(items.indexOf(a)<0){if(items[0])items[0].focus();return;}
  var r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,best=null,bs=1e9;
  items.forEach(function(e){
    if(e===a)return;var q=e.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy,p,o;
    if(dir==='right'){p=dx;o=dy;}else if(dir==='left'){p=-dx;o=dy;}else if(dir==='down'){p=dy;o=dx;}else{p=-dy;o=dx;}
    if(p<=4)return;var sc=p+Math.abs(o)*2.5;if(sc<bs){bs=sc;best=e;}
  });
  if(best){best.focus();try{best.scrollIntoView({block:'nearest'});}catch(e){}}
}
var SCOV=null;
function toggleScores(){
  if(SCOV){SCOV.remove();SCOV=null;focusFirst();return;}
  if(!S.ps.length||document.getElementById('nm'))return;
  var s=S.ps.slice().sort(function(a,b){return b.w.length-a.w.length||b.s-a.s;});
  SCOV=document.createElement('div');SCOV.className='scov';
  SCOV.innerHTML='<div class="card" style="max-width:640px;width:100%"><h2>Punteggi</h2>'+s.map(function(p){var j=S.ps.indexOf(p);return '<div class="rank">'+ringSVG(p.w,p.av)+'<span class="nm">'+esc(p.n)+'</span><b>'+p.w.length+'/6 · '+p.s+' pt</b></div>';}).join('')+
    '<button class="wide sec" id="scClose" style="margin-top:12px">Chiudi (0 o Esc)</button></div>';
  document.body.appendChild(SCOV);SCOV.querySelector('#scClose').onclick=toggleScores;SCOV.querySelector('#scClose').focus();
}
document.addEventListener('keydown',function(e){
  var k=e.key,kc=e.keyCode,t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')){if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();nav(k==='ArrowDown'?'down':'up');}return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(SCOV){if(k==='0'||k==='Escape'||k==='Backspace'||k==='GoBack'||kc===461||kc===10009||k==='Enter'){e.preventDefault();toggleScores();}return;}
  if(/^Arrow/.test(k)){e.preventDefault();nav(k.slice(5).toLowerCase());return;}
  var m={a:'1',b:'2',c:'3',A:'1',B:'2',C:'3'}[k]||k;
  var dk=document.querySelector('#app [data-key="'+m+'"]:not(:disabled)');
  if(dk&&/^[1-3]$/.test(m)){e.preventDefault();dk.click();return;}
  if(k==='0'){e.preventDefault();toggleScores();return;}
  if(k==='f'||k==='F'){e.preventDefault();toggleFS();return;}
  if(k==='m'||k==='M'){e.preventDefault();setSnd(!SND);return;}
  if(k==='Enter'&&(!document.activeElement||document.activeElement===document.body)){var g=document.querySelector('#nxtBtn,#rollBtn:not(:disabled),#goBtn,#againBtn');if(g){e.preventDefault();g.click();}}
});

// ── DADO 3D CHE ROTOLA SUL TAVOLO ──────────────────────────────────────────
// Rimbalza e rotola per ~2,8 s; alla fine traballa su uno spigolo prima di
// fermarsi. Ogni impatto fa il suo "toc" sul tavolo.
var FACEROT={1:[0,0],2:[90,0],3:[0,-90],4:[0,90],5:[-90,0],6:[0,180]};
function faceHTML(n){var on=PIPS[n],h='<div class="f f'+n+'">';for(var i=0;i<9;i++)h+='<i'+(on.indexOf(i)>=0?' class="on"':'')+'></i>';return h+'</div>';}
function rollDice(who,cb){
  var n=1+Math.floor(Math.random()*6);
  var ov=document.createElement('div');ov.className='dov';
  var faces=[[1,'rotateY(0deg)'],[6,'rotateY(180deg)'],[3,'rotateY(90deg)'],[4,'rotateY(-90deg)'],[5,'rotateX(90deg)'],[2,'rotateX(-90deg)']];
  ov.innerHTML='<div class="dt">'+esc(who)+' tira il dado…</div><div class="table"><div class="dshadow" id="dsh"></div><div class="die3" id="d3">'+
    faces.map(function(x){return faceHTML(x[0]).replace('class="f','style="transform:'+x[1]+' translateZ(calc(var(--ds)/2))" class="f');}).join('')+'</div></div><div class="dres" id="dres"></div>';
  document.body.appendChild(ov);
  var d3=ov.querySelector('#d3'),sh=ov.querySelector('#dsh'),tb=ov.querySelector('.table');
  var W=tb.clientWidth,H=tb.clientHeight,fr=FACEROT[n];
  var kx=(2+Math.floor(Math.random()*2))*360*(Math.random()<.5?-1:1),ky=(2+Math.floor(Math.random()*2))*360,kz=(1+Math.floor(Math.random()*2))*360;
  var T=2800,t0=null,lastS=1,startX=-W*.38,teeter=(Math.random()<.5?1:-1)*(22+Math.random()*14);
  function frame(now){
    if(t0===null)t0=now;
    var t=Math.min(1,(now-t0)/T),e=1-Math.pow(1-t,3);
    var rx=fr[0]+kx*(1-e),ry=fr[1]+ky*(1-e),rz=kz*(1-e);
    var u=Math.max(0,(t-.72)/.28),tilt=u>0?teeter*Math.pow(1-u,1.4)*Math.sin(u*Math.PI*2.4):0;
    var x=startX*(1-e)+(Math.random()-.5)*2*(1-t),
        bs=Math.sin(Math.min(t,.72)/.72*Math.PI*4.5),y=Math.abs(bs)*H*.32*Math.pow(1-Math.min(t,.72)/.72,1.8);
    if(t<.74&&bs*lastS<0)thud(0,.5*(1-t)+.12);
    lastS=bs;
    d3.style.transform='translate3d('+x+'px,'+(-y)+'px,0) rotateX('+(rx+tilt)+'deg) rotateY('+ry+'deg) rotateZ('+rz+'deg)';
    var sc=1-Math.min(.5,y/(H*.6));sh.style.transform='translate('+x+'px,'+(H*.16)+'px) scale('+sc+')';sh.style.opacity=.35+.4*sc;
    if(t<1){requestAnimationFrame(frame);return;}
    thud(0,.25);
    ov.querySelector('#dres').textContent='Hai fatto '+n+'!';
    setTimeout(function(){ov.remove();cb(n);},1200);
  }
  requestAnimationFrame(frame);
}

// ── TURN: QUESTION ────────────────────────────────────────────────────────
function ask(roll){
  var p=S.ps[S.t];
  var cat=catAt(p.pos);
  var isWedge=(p.pos%4===0);
  var data=pick(p.g,cat.k);
  S.cur={p:p,cat:cat,data:data,roll:roll,isWedge:isWedge,chosen:null};
  showQ();
}

function showQ(){
  stopTimer();
  var c=S.cur,p=c.p,cat=c.cat,data=c.data;
  var answered=(c.chosen!==null);
  var timedOut=(c.chosen===-1);
  var limit=TM.on?TM.s[p.g]:0;
  if(limit&&!answered&&!c.deadline)c.deadline=Date.now()+limit*1000;
  var kid=(p.g==='p'||p.g==='b');
  var j=S.ps.indexOf(p);

  var optsHtml=data.opts.map(function(o,i){
    var cls='opt';
    if(answered){
      if(o.ok)cls+=' ok';
      else if(i===c.chosen)cls+=' ko';
      else cls+=' dim';
    }
    var k=answered&&o.ok?'✓':answered&&i===c.chosen?'✗':'ABC'[i];
    var pic=p.g==='p'?picFor(o.t):'';
    return '<button class="'+cls+'" data-i="'+i+'" data-key="'+(i+1)+'"'+(answered?' disabled':'')+'><span class="k">'+k+'</span>'+(pic?'<span class="pic">'+pic+'</span>':'')+'<span>'+esc(o.t)+'</span></button>';
  }).join('');

  var feedbackHtml='';
  if(answered){
    var correct=!timedOut&&data.opts[c.chosen].ok;
    var gotWedge=correct&&c.isWedge&&p.w.indexOf(cat.k)>=0&&c.newWedge;
    feedbackHtml=
      '<div class="res">'+(correct
        ?'🎉 Esatto! +10 punti'+(gotWedge?'<br>Hai conquistato la laurea '+cat.e+'!':'')
        :(timedOut?'⏰ Tempo scaduto! Tocca al prossimo':'😅 Non è giusto… tocca al prossimo'))+'</div>'+
      '<div class="fact">💡 '+esc(data.fact)+'</div>'+
      '<button id="nxtBtn" class="wide cta" style="margin-top:14px">'+
        (p.w.length>=6?'🏆 Vedi il vincitore':correct?'Tira ancora!':'Avanti ➜')+'</button>';
  }

  render(
    '<div class="'+(kid?'kid':'')+'">'+
    brand(true)+
    '<div class="cols q"><div class="qside">'+boardSVG(true)+
    '<div class="tools"><button class="sec" id="speakBtn">🔊 Leggi ad alta voce</button>'+sndBtn()+'<button class="sec bfs" title="Schermo intero (F)">⛶</button></div>'+
    '</div><div>'+
    '<div class="card qcard pop">'+
      '<div class="qhead" style="background:'+cat.c+(cat.dark?';color:#1b2b40':'')+'"><span>'+esc(catLabel(cat,p.g))+'</span>'+(c.isWedge?'<span class="badge">🎓 Laurea</span>':'')+'</div>'+
      '<div class="qbody">'+
        '<div class="meta">'+p.av+' '+esc(p.n)+' · dado '+c.roll+'</div>'+
        (p.g==='p'&&qPic(data.q)&&!data.opts.some(function(o){var pf=picFor(o.t);return pf&&(qPic(data.q).indexOf(pf)>=0||pf.indexOf(qPic(data.q))>=0);})?'<div class="qpic">'+qPic(data.q)+'</div><div class="qtext">'+esc(qNoPic(data.q))+'</div>':'<div class="qtext">'+esc(data.q)+'</div>')+
        (limit&&!answered?'<div class="tmr" id="tmr"><span class="bar"><i id="tbar"></i></span><b id="tsec">'+limit+'</b></div>':'')+
        optsHtml+
        (answered?'':'<p class="kh">Rispondi con 1 2 3 (o A B C), oppure frecce + OK</p>')+
        feedbackHtml+
      '</div>'+
    '</div>'+
    '</div></div>'+
    '</div>'
  );
  if(answered){
    var ok=!timedOut&&data.opts[c.chosen].ok;
    if(!c.sounded){c.sounded=true;sfx(timedOut?'buzz':ok?(c.newWedge?'wedge':'ok'):'no');}
    if(ok&&!c.celebrated){c.celebrated=true;confetti();}
    var nb=document.getElementById('nxtBtn');if(nb)nb.scrollIntoView({block:'nearest',behavior:'smooth'});
  }

  // Timer
  if(limit&&!answered){
    var tick=function(){
      var left=Math.max(0,c.deadline-Date.now());
      var bar=document.getElementById('tbar'),sec=document.getElementById('tsec'),box=document.getElementById('tmr');
      if(bar){var sl=Math.ceil(left/1000);if(sl<=5&&sl>0&&sl!==c.lastTick){c.lastTick=sl;sfx('tick');}bar.style.width=(left/(limit*10))+'%';sec.textContent=sl;box.classList.toggle('low',left<=5000);}
      if(left<=0){stopTimer();c.chosen=-1;showQ();}
    };
    tick();timerIv=setInterval(tick,200);
  }

  // Option listeners
  if(!answered){
    document.querySelectorAll('.opt').forEach(function(b){
      b.addEventListener('click',function(){
        c.chosen=+b.dataset.i;

        if(correct){
          p.s+=10;
          if(c.isWedge&&p.w.indexOf(cat.k)<0){p.w.push(cat.k);c.newWedge=true;}

      var u=new SpeechSynthesisUtterance(txt);
      u.lang='it-IT';speechSynthesis.speak(u);
    }catch(e){}
  });
}

var DEVN={tv:'📺 TV con telecomando',cast:'📺📱 TV + cellulare',phone:'📱 Cellulare',pc:'💻 Computer','':''};
function chooser(){
  var o=[['tv','📺','TV con telecomando','frecce, OK e tasti 1 2 3'],['cast','📺📱','TV + cellulare','il telefono fa da telecomando'],['phone','📱','Solo cellulare','si gioca toccando lo schermo'],['pc','💻','Computer','mouse o tastiera']];
  render(brand()+'<p class="sub">Dove giochi?</p><div class="devs">'+o.map(function(x){return '<button class="dev'+(DEV===x[0]?' on':'')+'" data-d="'+x[0]+'"><span class="big">'+x[1]+'</span>'+x[2]+'<small>'+x[3]+'</small></button>';}).join('')+'</div>');
  document.querySelectorAll('.dev').forEach(function(b){b.addEventListener('click',function(){
    DEV=b.dataset.d;try{localStorage.setItem('tq_dev',DEV);}catch(e){}
    ac();if(DEV==='cast')castStart();else setup();
  });});
  var on=document.querySelector('.dev.on');if(on)try{on.focus();}catch(e){}
}
// ── TV + CELLULARE ─────────────────────────────────────────────────────────
// La TV mostra un QR; il telefono apre la stessa pagina con ?r=CODICE e
// diventa un telecomando che riceve i pulsanti visibili sulla TV.
var RCODE='',LINK=null,RCONNS=0,RID=0,LASTSNAP='',SNAPT=null;
function loadScript(src){return new Promise(function(ok,ko){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s);});}
function newCode(){var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',c='';for(var i=0;i<5;i++)c+=a[Math.floor(Math.random()*a.length)];return c;}
function remoteURL(){return location.origin+location.pathname+'?r='+RCODE+(/[?&]bc=1/.test(location.search)?'&bc=1':'');}
function qrSVG(text,cell){try{var q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:cell||6,margin:2,scalable:true});}catch(e){return '';}}
function castBadge(){return '<div class="castb">'+qrSVG(remoteURL(),3)+'<span>'+(RCONNS?'📱 Telefono collegato':'📱 Inquadra per usare il telefono')+'<br><span style="letter-spacing:.15em">'+RCODE+'</span></span></div>';}
function openLink(role,code,onMsg,onStatus){
  if(/[?&]bc=1/.test(location.search)){
    var ch=new BroadcastChannel('tq-'+code);
    ch.onmessage=function(ev){var d=ev.data;if(d.from===role)return;if(d.m.t==='hello'&&role==='host'){RCONNS=1;onStatus('conn');}onMsg(d.m);};
    setTimeout(function(){onStatus('ready');if(role==='phone')ch.postMessage({from:role,m:{t:'hello'}});},50);
    return {send:function(m){ch.postMessage({from:role,m:m});}};
  }
  var conns=[],link={send:function(m){conns.forEach(function(c){try{if(c.open)c.send(m);}catch(e){}});}};
  loadScript('lib/peerjs.min.js').then(function(){
    var peer=role==='host'?new Peer('tqpx-'+code):new Peer();
    peer.on('error',function(err){onStatus('error',err&&err.type);});
    peer.on('disconnected',function(){try{peer.reconnect();}catch(e){}});
    if(role==='host'){
      peer.on('open',function(){onStatus('ready');});
      peer.on('connection',function(c){
        conns.push(c);
        c.on('open',function(){RCONNS=conns.filter(function(x){return x.open;}).length;onStatus('conn');});
        c.on('data',onMsg);
        c.on('close',function(){conns=conns.filter(function(x){return x!==c;});RCONNS=conns.length;onStatus(RCONNS?'conn':'lost');});
      });
    } else {
      peer.on('open',function(){
        var c=peer.connect('tqpx-'+code,{reliable:true});
        c.on('open',function(){conns=[c];onStatus('conn');c.send({t:'hello'});});
        c.on('data',onMsg);
        c.on('close',function(){onStatus('lost');});
      });
    }
  }).catch(function(){onStatus('error','lib');});
  return link;
}
function castStart(){
  RCODE=RCODE||newCode();
  render(brand()+'<div class="card" style="text-align:center"><h2>Collega il telefono</h2>'+
    '<div class="qrbox"><div id="qr"></div><div><p>Inquadra il QR con la fotocamera del telefono<br>oppure apri questo indirizzo:</p><p style="font-weight:800;word-break:break-all;margin:8px 0">'+esc(remoteURL())+'</p><p>Codice partita</p><div class="code">'+RCODE+'</div></div></div>'+
    '<p class="hint" id="cst">Preparo il collegamento…</p>'+
    '<button class="sec wide" id="skip" style="margin-top:14px">Continua senza telefono</button></div>');
  document.getElementById('skip').addEventListener('click',function(){setup();});
  loadScript('lib/qrcode.js').then(function(){var q=document.getElementById('qr');if(q)q.innerHTML=qrSVG(remoteURL(),6);}).catch(function(){});
  if(!LINK)LINK=openLink('host',RCODE,hostMsg,function(st,why){
    var el=document.getElementById('cst');
    if(st==='ready'&&el)el.textContent='In attesa del telefono… (TV e telefono sulla stessa rete Wi-Fi)';
    if(st==='conn'){sendSnap(true);if(document.getElementById('skip'))setup();}
    if(st==='error'){
      if(why==='unavailable-id'){LINK=null;RCODE=newCode();castStart();return;}
      if(el)el.textContent='Non riesco a collegarmi ('+(why||'errore')+'). Puoi continuare senza telefono.';
    }
    var b=document.querySelector('.castb');if(b)b.outerHTML=castBadge();
  });
  startMirror();
}
function snapScope(){return document.querySelector('.scov')||app;}
function txt(e){return e?e.innerText.replace(/\s+/g,' ').trim():'';}
function buildSnap(){
  var sc=snapScope(),keys=[],groups=[],inputs=[],cur=null,speak=null;
  sc.querySelectorAll('button,input').forEach(function(e){
    if(e.offsetParent===null&&!e.closest('.scov'))return;
    if(e.classList.contains('bfs')||e.classList.contains('bsnd')||e.closest('.castb'))return;
    if(!e.dataset.rid)e.dataset.rid=String(++RID);
    if(e.tagName!=='BUTTON'){inputs.push({r:e.dataset.rid,ph:e.placeholder||'',v:e.value});return;}
    if(e.id==='speakBtn'){speak={g:'speak',lab:'',sw:false,items:[{r:e.dataset.rid,l:txt(e),d:false}]};return;}
    var box=e.closest('.switch,.ages,.trow'),g=box?(box.id||box.className+(box.querySelector('.tl')?txt(box.querySelector('.tl')):'')):'b';
    if(!cur||cur.g!==g){
      var lab='';
      if(box&&box.classList.contains('trow'))lab=txt(box.querySelector('.tl'))+' · '+txt(box.querySelector('.v'));
      else if(box){var pr=box.previousElementSibling;while(pr&&!pr.classList.contains('lbl')&&pr.tagName!=='H2')pr=pr.previousElementSibling;lab=txt(pr);}
      cur={g:g,lab:lab,sw:!!box,items:[]};groups.push(cur);
    }
    cur.items.push({r:e.dataset.rid,l:txt(e)||e.getAttribute('aria-label')||'',d:e.disabled,on:e.classList.contains('on')});
  });
  if(speak)groups.push(speak);
  var q=sc.querySelector('.qtext'),res=sc.querySelector('.res'),fact=sc.querySelector('.fact');
  return {t:'snap',bar:txt(sc.querySelector('.meta'))||txt(sc.querySelector('.qhead')),
    title:q?txt(q):txt(sc.querySelector('.who')||sc.querySelector('h2')),msg:[txt(res),txt(fact)].filter(Boolean).join(' — '),keys:keys,groups:groups,inputs:inputs};
}
function sendSnap(force){if(!LINK)return;var s=buildSnap(),j=JSON.stringify(s);if(force||j!==LASTSNAP){LASTSNAP=j;LINK.send(s);}}
function startMirror(){
  if(window._mo)return;
  window._mo=new MutationObserver(function(){clearTimeout(SNAPT);SNAPT=setTimeout(function(){sendSnap(false);},120);});
  window._mo.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled','class'],characterData:true});
}
function hostMsg(m){
  if(m.t==='hello'){sendSnap(true);return;}
  var el=m.r?document.querySelector('[data-rid="'+m.r+'"]'):null;
  if(m.t==='click'&&el&&!el.disabled){try{el.focus({preventScroll:true});}catch(e){}el.click();}
  else if(m.t==='input'&&el){el.value=m.v;el.dispatchEvent(new Event('input',{bubbles:true}));}
  else if(m.t==='enter'&&el){el.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));}
  setTimeout(function(){sendSnap(false);},60);
}
var RSNAP=null,RLINK=null,RSTAT='Mi collego alla TV…';
function controller(code){
  RLINK=openLink('phone',code,function(m){if(m.t==='snap'){RSNAP=m;RSTAT='✅ Collegato alla TV · guarda la TV, comanda da qui';drawRemote();}},function(st,why){
    RSTAT=st==='conn'?'✅ Collegato alla TV · guarda la TV, comanda da qui':st==='lost'?'⚠️ Collegamento perso: ricarica la pagina':st==='error'?'⚠️ Non riesco a collegarmi ('+(why||'errore')+'). Controlla che la TV mostri il QR.':'Mi collego alla TV…';
    var e=document.getElementById('rst');if(e){e.textContent=RSTAT;e.className='rst'+(st==='conn'?' ok':'');}else drawRemote();
  });
  drawRemote();
}
function drawRemote(){
  var a=document.activeElement,fr=a&&a.dataset?a.dataset.r:null,fv=fr?a.value:null;
  var s=RSNAP,h=brand(true)+'<div class="rc"><p class="rst'+(/Collegato/.test(RSTAT)?' ok':'')+'" id="rst">'+esc(RSTAT)+'</p>';
  if(s){
    if(s.bar)h+='<p class="rbar">'+esc(s.bar)+'</p>';
    if(s.title)h+='<p class="rt">'+esc(s.title)+'</p>';
    h+='<p class="rm">'+esc(s.msg||'')+'</p>';
    s.inputs.forEach(function(i){h+='<input data-r="'+i.r+'" placeholder="'+esc(i.ph)+'" value="'+esc(i.v)+'" autocomplete="off">';});
    s.groups.forEach(function(g){
      if(g.lab)h+='<p class="rgl">'+esc(g.lab)+'</p>';
      h+='<div class="rbtns'+(g.sw?' sw':'')+'">'+g.items.map(function(b){return '<button data-b="'+b.r+'" class="'+(b.on?'on ':'')+(g.sw?'':'wide')+'"'+(b.d?' disabled':'')+'>'+esc(b.l)+'</button>';}).join('')+'</div>';
    });
  }
  render(h+'</div>');
  document.querySelectorAll('[data-b]').forEach(function(b){b.addEventListener('click',function(){RLINK.send({t:'click',r:b.dataset.b});});});
  document.querySelectorAll('[data-r]').forEach(function(i){
    i.addEventListener('input',function(){RLINK.send({t:'input',r:i.dataset.r,v:i.value});});
    i.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();RLINK.send({t:'enter',r:i.dataset.r});}});
    if(i.dataset.r===fr){i.value=fv;i.focus();try{i.setSelectionRange(fv.length,fv.length);}catch(e){}}
  });
}
var RPARAM=(location.search.match(/[?&]r=([A-Z0-9]{4,8})/i)||[])[1];
var DPARAM=(location.search.match(/[?&]dev=(tv|phone|pc)/)||[])[1];
function first(){if(DPARAM){DEV=DPARAM;setup();}else chooser();}

// ── START ─────────────────────────────────────────────────────────────────
render(brand()+'<div class="card" style="text-align:center">Carico le domande…</div>');
if(RPARAM)controller(RPARAM.toUpperCase());
else fetch('trivia_database.json',{cache:'no-cache'})
  .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
  .then(function(d){DB=d;DBN=Object.keys(d).reduce(function(s,g){return s+Object.keys(d[g]).reduce(function(a,c){return a+d[g][c].length;},0);},0);first();})
  .catch(function(){
    render(brand()+'<div class="card" style="text-align:center"><h2>Non riesco a caricare le domande 😕</h2>'+
      '<p style="margin-top:8px">Il file <b>trivia_database.json</b> deve stare nella stessa cartella di questa pagina. '+
      'Se hai aperto la pagina facendo doppio clic sul file, aprila invece dall’indirizzo online.</p></div>');
  });
</script>
